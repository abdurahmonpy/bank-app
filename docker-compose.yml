version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: bank_app_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: bank_app_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py PopulateCommand &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-production-secret-key-change-me
      - ALLOWED_HOSTS=*
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis

  celery_worker:
    build: .
    container_name: bank_app_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l info
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
      - web

  celery_beat:
    build: .
    container_name: bank_app_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l info
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis
      - web

volumes:
  redis_data:
